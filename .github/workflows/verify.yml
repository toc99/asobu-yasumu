name: Verify application and Firestore Rules
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and static regression tests
        run: npm test
      - name: Google Home playback guard tests
        run: |
          python3 -m pip install imageio-ffmpeg==0.6.0
          python3 tests/google-home-playback.py
      - name: Firestore Security Rules emulator tests
        run: npm run test:rules
